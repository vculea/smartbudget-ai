server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: smartbudget-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/smartbudget}
      auto-index-creation: true
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

smartbudget:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${SEED_ENABLED:false}
    user-id: ${SEED_USER_ID:}
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    jwt-secret: ${JWT_SECRET:}
    token-ttl: ${AUTH_TOKEN_TTL:12h}
    allowed-emails: ${ALLOWED_EMAILS:}
  ai:
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    vision-model: ${AI_VISION_MODEL:}
    connect-timeout: ${AI_CONNECT_TIMEOUT:5s}
    read-timeout: ${AI_READ_TIMEOUT:30s}
    json-mode: ${AI_JSON_MODE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mongo:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

logging:
  level:
    root: INFO
