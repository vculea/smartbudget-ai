services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-smartbudget}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No published ports: MongoDB is only reachable from the backend on the internal network.
    networks:
      - internal

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      MONGODB_URI: mongodb://${MONGO_USER:-smartbudget}:${MONGO_PASSWORD}@mongo:27017/smartbudget?authSource=admin
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_READ_TIMEOUT: ${AI_READ_TIMEOUT:-30s}
      AI_JSON_MODE: ${AI_JSON_MODE:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SEED_ENABLED: ${SEED_ENABLED:-false}
      SEED_USER_ID: ${SEED_USER_ID:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      JWT_SECRET: ${JWT_SECRET:-}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-12h}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${GOOGLE_DRIVE_REFRESH_TOKEN:-}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    # Permite apelarea unui Ollama rulat pe gazdă (http://host.docker.internal:11434/v1) și pe Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # ID-ul clientului Google este public (ajunge în bundle), la fel ca pe backend
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    networks:
      - internal

volumes:
  mongo-data:

networks:
  internal:
