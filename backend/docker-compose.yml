services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-smartbudget}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No published ports: MongoDB is only reachable from the backend on the internal network.
    networks:
      - internal

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      MONGODB_URI: mongodb://${MONGO_USER:-smartbudget}:${MONGO_PASSWORD}@mongo:27017/smartbudget?authSource=admin
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SEED_ENABLED: ${SEED_ENABLED:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - internal

volumes:
  mongo-data:

networks:
  internal:
